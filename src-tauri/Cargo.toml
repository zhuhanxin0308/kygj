[package]
name = "gravity-workbench-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gravity_workbench_desktop"
# 六个桌面目标均由Rust二进制链接，不生成移动端使用的额外原生库产物。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde.workspace = true
serde_json.workspace = true
workbench-core = { path = "../crates/workbench-core" }

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
tempfile.workspace = true
rusqlite.workspace = true

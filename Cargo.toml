[workspace]
members = ["crates/workbench-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
sha2 = "=0.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"

[profile.release]
# 保留安全展开行为并缩小桌面体积；不以快速数学选项改变数值语义。
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# 保留项目代码的行级诊断，同时控制大型Windows绑定的编译内存。
[profile.dev]
debug = 1

[profile.dev.package.windows]
debug = 0

[profile.test.package.windows]
debug = 0
